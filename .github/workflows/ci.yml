name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  ci:
    name: Code Verification (Lint, Test, Build, Security)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.8.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Nx SHAs for affected commands
        uses: nrwl/nx-set-shas@v4

      - name: Lint Code (ESLint & Prettier)
        run: pnpm exec nx affected -t lint --parallel=3

      - name: Run Unit & Integration Tests
        run: pnpm exec nx affected -t test --parallel=3

      - name: Build Applications (TypeScript Compiler Check)
        run: pnpm exec nx affected -t build --parallel=3

      - name: Run React Doctor Code Quality Scan
        run: |
          echo "Uruchamianie skanowania react-doctor..."
          # Uruchamiamy bez interaktywności i zapisujemy raport diagnostyczny
          npx react-doctor@latest --non-interactive --verbose || echo "React Doctor znalazł ostrzeżenia."
