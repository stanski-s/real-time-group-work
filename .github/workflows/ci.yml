name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  ci:
    name: Code Verification (Lint, Test, Build, Security, E2E)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: slack_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://admin:password123@localhost:5432/slack_db?schema=public"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.8.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Nx SHAs for affected commands
        uses: nrwl/nx-set-shas@v4

      - name: Generate Prisma Client & Run Database Migrations
        run: |
          pnpm db:generate
          npx prisma migrate deploy --schema=libs/database/prisma/schema.prisma

      - name: Lint Code (ESLint & Prettier)
        run: pnpm exec nx affected -t lint --parallel=3

      - name: Run Unit & Integration Tests
        run: pnpm exec nx affected -t test --parallel=3

      - name: Build Applications (TypeScript Compiler Check)
        run: pnpm exec nx affected -t build --parallel=3

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E Tests
        run: pnpm exec nx affected -t e2e --parallel=1

      - name: Run React Doctor Code Quality Scan
        run: |
          echo "Uruchamianie skanowania react-doctor..."
          # Uruchamiamy bez interaktywności i zapisujemy raport diagnostyczny
          npx react-doctor@latest --non-interactive --verbose || echo "React Doctor znalazł ostrzeżenia."
